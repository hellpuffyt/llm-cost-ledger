[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-cost-ledger"
version = "0.1.0"
description = "Attribute LLM API spend per project, model and prompt from provider usage exports, with drift alerts on cost per request."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prabesh Sharma", email = "hellpuffyyt@gmail.com" }
]
keywords = ["llm", "cost", "finops", "openai", "anthropic", "observability", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/hellpuffyt/llm-cost-ledger"
Issues = "https://github.com/hellpuffyt/llm-cost-ledger/issues"

[project.scripts]
llm-cost-ledger = "llm_cost_ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost_ledger"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
