<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
  <title id="t">llm-cost-ledger data flow</title>
  <desc id="d">Provider usage exports are parsed by ingest.py into UsageRecords, priced by pricing.py using the bundled table plus an optional override, tagged with project and feature by attribution.py using mapping rules, then aggregated by report.py or compared across two periods by drift.py with Welch's t-test.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#A3AAA6"/>
    </marker>
  </defs>
  <rect width="1200" height="460" fill="#0C0D0D"/>
  <text x="30" y="44" fill="#EEEAE2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">llm-cost-ledger</text>
  <text x="30" y="68" fill="#A3AAA6" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">Offline pipeline from provider usage exports to a spend report or a drift check. Every stage is a module under src/llm_cost_ledger/.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <!-- inputs -->
    <rect x="30" y="120" width="190" height="62" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="44" y="146" fill="#EEEAE2" font-size="13">openai=PATH</text>
    <text x="44" y="168" fill="#A3AAA6" font-size="11">JSON {data:[...]} or CSV</text>
    <rect x="30" y="200" width="190" height="62" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="44" y="226" fill="#EEEAE2" font-size="13">anthropic=PATH</text>
    <text x="44" y="248" fill="#A3AAA6" font-size="11">CSV or JSON list</text>

    <!-- ingest -->
    <rect x="260" y="120" width="190" height="142" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="274" y="146" fill="#EEEAE2" font-size="13">ingest.py</text>
    <text x="274" y="172" fill="#A3AAA6" font-size="11">parse_openai_export</text>
    <text x="274" y="190" fill="#A3AAA6" font-size="11">parse_anthropic_export</text>
    <text x="274" y="208" fill="#A3AAA6" font-size="11">alias columns, strict</text>
    <text x="274" y="226" fill="#A3AAA6" font-size="11">int checks</text>
    <text x="274" y="250" fill="#EEEAE2" font-size="11">-&gt; list[UsageRecord]</text>

    <!-- pricing -->
    <rect x="490" y="150" width="190" height="82" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="504" y="176" fill="#EEEAE2" font-size="13">pricing.py</text>
    <text x="504" y="198" fill="#A3AAA6" font-size="11">PricingTable.cost_of()</text>
    <text x="504" y="216" fill="#A3AAA6" font-size="11">exact Decimal per record</text>

    <!-- attribution -->
    <rect x="720" y="150" width="190" height="82" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="734" y="176" fill="#EEEAE2" font-size="13">attribution.py</text>
    <text x="734" y="198" fill="#A3AAA6" font-size="11">first matching rule</text>
    <text x="734" y="216" fill="#A3AAA6" font-size="11">-&gt; (project, feature)</text>

    <!-- config inputs -->
    <rect x="490" y="300" width="190" height="62" rx="6" fill="#0C0D0D" stroke="#2A2E2D" stroke-dasharray="4 4"/>
    <text x="504" y="326" fill="#EEEAE2" font-size="12">default_pricing.yaml</text>
    <text x="504" y="348" fill="#A3AAA6" font-size="11">merged with --pricing</text>
    <rect x="720" y="300" width="190" height="62" rx="6" fill="#0C0D0D" stroke="#2A2E2D" stroke-dasharray="4 4"/>
    <text x="734" y="326" fill="#EEEAE2" font-size="12">--mapping YAML</text>
    <text x="734" y="348" fill="#A3AAA6" font-size="11">else feature=unattributed</text>

    <!-- outputs -->
    <rect x="950" y="100" width="220" height="104" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="964" y="126" fill="#EEEAE2" font-size="13">report</text>
    <text x="964" y="148" fill="#A3AAA6" font-size="11">report.py: group, sum, render</text>
    <text x="964" y="166" fill="#A3AAA6" font-size="11">table | json | csv</text>
    <text x="964" y="190" fill="#3FBF8A" font-size="11">exit 2 if $/req &gt; gate</text>

    <rect x="950" y="224" width="220" height="122" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="964" y="250" fill="#EEEAE2" font-size="13">drift</text>
    <text x="964" y="272" fill="#A3AAA6" font-size="11">drift.py: daily $/req,</text>
    <text x="964" y="290" fill="#A3AAA6" font-size="11">baseline vs current</text>
    <text x="964" y="308" fill="#A3AAA6" font-size="11">stats.py: Welch's t-test</text>
    <text x="964" y="332" fill="#3FBF8A" font-size="11">exit 3 on regression</text>
  </g>

  <g stroke="#A3AAA6" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M220 151H258"/>
    <path d="M220 231H258"/>
    <path d="M450 191H488"/>
    <path d="M680 191H718"/>
    <path d="M585 300V234"/>
    <path d="M815 300V234"/>
    <path d="M910 191H930V152H948"/>
    <path d="M930 191V285H948"/>
  </g>

  <text x="30" y="420" fill="#A3AAA6" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">No network access and no API keys. A model missing from the pricing table, or malformed input, stops the run with exit 1.</text>
</svg>
